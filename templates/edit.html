<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit expense</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main><header><h1>Edit expense</h1><p>Update an existing expense.</p></header><section>{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}<form method="post"><label>Description<input name="description" maxlength="120" required value="{{ expense['description'] }}"></label><label>Amount (£)<input name="amount" type="number" min="0.01" max="1000000" step="0.01" required value="{{ '%.2f'|format(expense['amount']) }}"></label><label>Category<select name="category">{% for c in categories %}<option value="{{ c }}" {% if c == expense['category'] %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>Date<input name="spent_on" type="date" required value="{{ expense['spent_on'] }}"></label><button type="submit">Save changes</button></form><p><a href="{{ url_for('index') }}">Cancel and go back</a></p></section></main></body></html>
